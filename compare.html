			const tooltip = document.getElementById('custom-tooltip');
			const legendItems = document.querySelectorAll('#plot0 .legend .traces');
			legendItems.forEach((item, index) => {

				
				item.addEventListener('mouseover', (event) => {
					
					tooltip.innerHTML = legendsHover0[index];
					
					tooltip.style.display = 'block';
				});

				
				item.addEventListener('mousemove', (event) => {
					
					
					tooltip.style.left = (event.pageX - tooltip.offsetWidth - 10) + 'px';
					
					tooltip.style.top = (event.pageY + 10) + 'px';
				});

					tooltip.style.display = 'none';
				});

			paper_bgcolor: '#222222',
			plot_bgcolor: '#222222',
			font: { color: '#ffffff' }
		}).then(() => {
			const tooltip = document.getElementById('custom-tooltip');
			const legendItems = document.querySelectorAll('#plot1 .legend .traces');
			legendItems.forEach((item, index) => {

				
				item.addEventListener('mouseover', (event) => {
					
					tooltip.innerHTML = legendsHover1[index];
					
					tooltip.style.display = 'block';
				});

				
				item.addEventListener('mousemove', (event) => {
					
					
					tooltip.style.left = (event.pageX - tooltip.offsetWidth - 10) + 'px';
					
					tooltip.style.top = (event.pageY + 10) + 'px';
				});

				
				item.addEventListener('mouseout', () => {
					
					tooltip.style.display = 'none';
				});
			});
		});
